name: Build Ghostscript (Manual Copy - Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout printing packages (your fork)
        uses: actions/checkout@v4
        with:
          repository: im8dmm/openwrt-printing-packages
          path: printing-packages

      - name: Download and extract OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/23.05.4/targets/mediatek/filogic/openwrt-sdk-23.05.4-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          wget $SDK_URL
          tar -xf openwrt-sdk-*.tar.xz
          sdk_dir=$(ls -d openwrt-sdk-*/ | head -1)
          mv "$sdk_dir" sdk
          rm openwrt-sdk-*.tar.xz

      - name: Manually copy ghostscript package to SDK
        run: |
          # 将 ghostscript 目录复制到 SDK 的 package 目录下
          cp -r printing-packages/net/ghostscript sdk/package/
          echo "ghostscript copied to sdk/package/ghostscript"

      - name: Remove cups dependency from ghostscript Makefile
        run: |
          GS_MAKEFILE="sdk/package/ghostscript/Makefile"
          if [ ! -f "$GS_MAKEFILE" ]; then
            echo "ERROR: ghostscript Makefile not found at $GS_MAKEFILE"
            exit 1
          fi
          cp $GS_MAKEFILE $GS_MAKEFILE.bak
          # 删除 DEPENDS 行中的 cups (以及可能存在的 +cups)
          sed -i '/DEPENDS:=/ s/ \+cups\( \|$\)//g' $GS_MAKEFILE
          sed -i '/DEPENDS:=/ s/cups //g' $GS_MAKEFILE
          # 删除 configure 参数中的 --with-cups
          sed -i 's/--with-cups[^ ]*//g' $GS_MAKEFILE
          echo "Removed cups dependency from ghostscript"

      - name: Update feeds (only for dependencies)
        run: |
          cd sdk
          ./scripts/feeds update -a
          # 安装 ghostscript 需要的依赖库（来自官方 packages feed）
          ./scripts/feeds install zlib libpng libjpeg-turbo libtiff expat freetype fontconfig lcms2

      - name: Configure build
        run: |
          cd sdk
          # 选中 ghostscript 和依赖库
          echo 'CONFIG_PACKAGE_ghostscript=y' >> .config
          echo 'CONFIG_PACKAGE_zlib=y' >> .config
          echo 'CONFIG_PACKAGE_libpng=y' >> .config
          echo 'CONFIG_PACKAGE_libjpeg-turbo=y' >> .config
          echo 'CONFIG_PACKAGE_libtiff=y' >> .config
          echo 'CONFIG_PACKAGE_libexpat=y' >> .config
          echo 'CONFIG_PACKAGE_freetype=y' >> .config
          echo 'CONFIG_PACKAGE_fontconfig=y' >> .config
          echo 'CONFIG_PACKAGE_lcms2=y' >> .config
          # 确保 cups 不被选中
          echo '# CONFIG_PACKAGE_cups is not set' >> .config
          make defconfig

      - name: Compile ghostscript
        run: |
          cd sdk
          make package/ghostscript/compile V=s

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostscript-ipk
          path: sdk/bin/packages/*/packages/*.ipk
